[package]
name = "riir-reflex"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Decision-engine serving + comparison + contribution (Plan 603 / Proposal 014 Phase 1): the modelless lane over katgpt_core::decision_wire, the laya comparison lane, and the honest-metrics harness."
repository = "https://github.com/gist-rs/riir-reflex"
homepage = "https://github.com/gist-rs/riir-reflex"
publish = false

[workspace]

[dependencies]
# The ONE code-level dep (BOUNDARY.md): the modelless substrate.
# serde + postcard ride its non-optional deps; serde_json below is the
# HTTP/JSON edge only.
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core", default-features = false }
# preserve_order: the laya lane renders Python dicts whose INSERTION ORDER is
# the option order (label indices shift if reordered — parity-critical).
serde_json = { version = "1", features = ["preserve_order"] }
# serde + derive: the /feedback envelope at the HTTP edge (already in-tree
# via katgpt-core's non-optional serde — no new package; edge-only by law).
serde = { version = "1", features = ["derive"] }

# ── laya lane (opt-in `laya-riir`) — MOVED substrate-side (the
# consolidation issue's encoder-lane move): the lane + its deps now live
# in the inference substrate repo's `riir-infer-laya` crate; reflex
# consumes it via a `pub use` shim (`src/laya/mod.rs`, public API
# unchanged) and keeps the consumer-side G5 parity gate + fixtures. The
# dep is NON-OPTIONAL because the UNGATED Python-JSON byte writer moved
# with the lane (the harness consumes it at default features) — its lane
# deps (tokenizers/gemm/metal/...) ride the crate's OWN opt-in features,
# so the default build compiles only the writer, never that tree.
# `default-features = false` is explicit: nothing of the lane lights up
# until the forwarding features below.
riir-infer-laya = { path = "../riir-infer/crates/riir-infer-laya", default-features = false }
# blake3: the small-file house hash for the MODELLESS engine — the fixture
# digests, the G5 pairing check, the corpus-row digests (the `modelless` +
# `corpus_db` features below). The LANE's hash-family rationale (SHA-256
# weight pins, blake3 small-file pins) moved with the lane; its manifest
# carries it now.
blake3 = { version = "1", optional = true }
[features]
# The Proposal 014 Phase-1 modelless decision engine (Plan 603 T1.3) is the
# product of this repo and ships default-on the way an application crate's
# own domain ships default-on (the riir-clippy `clippy_lints`/`dist`
# precedent) — the GOAT discipline binds the engine's CLAIMS (G1 calibration
# vs floors, G2/G4 gates land WITH the lane), not whether the binary exists.
# `--no-default-features` is the tested flag-OFF posture (empty-ish lib, no
# bin — the [[bin]] row carries required-features).
default = ["modelless"]
modelless = [
    "katgpt-core/action_bridge",
    "katgpt-core/sigmoid_calibration",
    "katgpt-core/distance_abstain",
    "katgpt-core/compression_drafter",
    "katgpt-core/variable_rank_domain_expert",
    "katgpt-core/decision_wire",
    "katgpt-core/state_option_scoring",
    "katgpt-core/template_decode",
    "dep:blake3",
]
# Issue 038 T1: per-label naive-Bayes count tables (katgpt-core
# `contrastive_scope`, GOAT-passed at katgpt-rs Bench 669 — frozen counts,
# log2-odds, BLAKE3-committed). Opt-in until the GOAT verdict; the engine
# knob `nb_scale` stays 0 (byte-identical) unless a caller arms it.
nb_scope = ["modelless", "katgpt-core/contrastive_scope"]
# The riir-OWNED forward — the ONE laya backend (the candle reference
# lane was removed by `.issues/006`, owner directive 2026-09-22) — MOVED
# substrate-side (the encoder-lane move): the model math + the whole lane
# substrate live in the inference substrate's `riir-infer-laya` crate;
# this feature simply forwards. `gemm` is the ONE kernel dep there.
# `dep:blake3` rides along because the lane's gates (laya_riir_parity,
# laya_batch_parity) + the laya_oracle_batch example hash the frozen
# capture with it — without this row the `--no-default-features
# --features laya-riir --all-targets` posture fails E0433 (the
# parity-file blake3 usage predates the posture's last run).
laya-riir = ["riir-infer-laya/laya-riir", "dep:blake3"]
# The riir forward's OWN Metal backend — MOVED with the lane
# (`riir-infer-laya/laya-riir-metal`, where the dep is macOS
# TARGET-SCOPED, so the feature is inert on Linux/Windows instead of a
# dep-tree failure). `LAYA_DEVICE=metal` is HONORED by the lane; G5
# parity must be green at THIS posture before any riir-Metal number is
# published.
laya-riir-metal = ["laya-riir", "riir-infer-laya/laya-riir-metal"]
# The riir forward's ANE whole-graph backend — MOVED with the lane
# (`riir-infer-laya/laya-riir-ane`, macOS target-scoped there): the
# encoder executes the digest-pinned BC1S Core ML artifacts (Plan 002
# P0's offline conversion, local-only), the gather + head stay host-side.
# `LAYA_DEVICE`-free posture selection: `RiirAgent::load_ane` OWNS the
# posture. The G5-ANE decision-level gate (`tests/laya_ane_parity.rs`)
# is the lane's parity authority — top-1 agreement + the near-tie band;
# p-drift is observation, never a gate (fp16 math).
laya-riir-ane = ["laya-riir", "riir-infer-laya/laya-riir-ane"]
# The riir forward's OWN CUDA backend (.issues/002 there — the 4090 lane):
# cudarc 0.19 + nvrtc runtime PTX compile, non-macOS TARGET-SCOPED in the
# lane crate (inert on macOS instead of a dep-tree failure). Non-macOS
# builds that compile it DEFAULT to the cuda posture at runtime
# (`LAYA_DEVICE=cpu` opts out); `LAYA_DEVICE=cuda` is honored verbatim.
# G5 parity must be green at THIS posture before any riir-CUDA number is
# published.
laya-riir-cuda = ["laya-riir", "riir-infer-laya/laya-riir-cuda"]
# The riir forward's CubeCL/wgpu backend (plan 611 — the T7 op-layer
# unification arm): ONE portable op vocabulary over the engine's CubeCL
# kernels, behind the SAME feature name there (`riir-infer-laya/
# laya-riir-cubecl`, the optional in-repo gpu path dep). Never a runtime
# default; `LAYA_DEVICE=cubecl` selects it explicitly, and the G5 arm in
# `tests/laya_riir_parity.rs` compiles in only under this feature. The
# plan 611 S5 A/B (Metal vs Cubecl vs Cpu, one process,
# `RiirAgent::load_with_device`) prices the arm's fate.
#
# The gpu tree carries this workspace's OWN [patch.crates-io] rows for
# `cubecl-runtime` + `wgpu-hal` (the parent vendored copies — its
# `cubecl_runtime.rs` video-memory probe compiles against them and
# NOTHING else). [patch] does NOT propagate across workspace boundaries,
# so the FIRST cross-workspace resolution of riir-infer-gpu (this
# feature) must re-declare them, pointing at the parent's vendor/ tree.
laya-riir-cubecl = ["laya-riir", "riir-infer-laya/laya-riir-cubecl"]
# Warm-tier persistence for the harness via the released `ndb` BINARY
# (Issue 007 P1): subprocess-only — zero storage-leaf cargo deps; the only
# new package is blake3 (already in-tree via `modelless`). NATIVE-ONLY by
# construction — must never join a wasm32 combo (the `trace_index` rule);
# default-OFF and never in the release set. The consumer-side golden pin
# against the real binary lives at
# `src/harness/corpus_db.rs::binary_wire_golden_round_trip` (loud-skip
# without the binary; run with NDB_BIN set for the full pin).
corpus_db = ["dep:blake3"]
# Issue 024: the near-duplicate leak report (`src/harness/slice_leak.rs`).
# A REPORT, not a runtime primitive: opt-in, zero deps, native-only, never
# in the release set. Its G1 oracle is `scripts/slice_leak_probe.py`.
slice_leak = []
# Issue 019 T1: the CLM comparison lane (`src/lanes/clm.rs`) — the external
# Apache-2.0 Contrastive-LM reference served over HTTP (`clm-serve` + vLLM
# pooling), measured in the arena's comparison tables. NEVER a product
# lane; their stack serves, our Rust measures. Implies the wire vocabulary
# (no new packages: std HTTP + the in-tree serde_json/preserve_order);
# default-OFF and never in the release set. The T1 prose-rendering goldens
# + the T2(b) stub-HTTP wire-shape test live in-module; the determinism
# pin + the harness column ride T3 (`.issues/027`, the 4090 window).
clm-lane = ["katgpt-core/decision_wire"]

[[bin]]
name = "reflex"
path = "src/bin/reflex.rs"
required-features = ["modelless"]

# The Plan 603 T1.5 harness runner — CI-regenerated tables live here.
[[bin]]
name = "harness"
path = "src/bin/harness.rs"
required-features = ["modelless"]

# Repo-birth gate discipline (Plan 603 T1.1e): every gated target carries its
# required-features row in the SAME commit it lands. `engine_gates` opens with
# #![cfg(feature = "modelless")] — without this row a --no-default-features
# run would print `ok. 0 passed`, exit 0, byte-for-byte a real pass.
[[test]]
name = "engine_gates"
required-features = ["modelless"]

[[test]]
name = "game_heads_serve"
required-features = ["modelless"]

# The substrate lane's G5 gate (CONSUMER-SIDE — the lane moved to the
# inference substrate, this gate stays): the SAME fixture corpus +
# expected capture over `RiirAgent`, replayed through the shim. No number
# from the lane is published before this is green. The frozen captures in
# tests/fixtures/ ARE the reference now.
[[test]]
name = "laya_riir_parity"
required-features = ["laya-riir"]

# The batched-system_one gate (issue 020 T5): the packed multi-question
# forward replays the SAME expected capture at the SAME gates. Whole-file
# #![cfg(feature = "laya-riir")] — this row keeps a feature-less
# selection skipping it loudly instead of printing a green zero.
[[test]]
name = "laya_batch_parity"
required-features = ["laya-riir"]

# The G5-ANE gate (Plan 002 P1 T1.2): decision-level parity of the ANE
# whole-graph lane vs the same frozen goldens — top-1 agreement + every
# flip inside the near-tie band; p-drift printed as observation. Loud-skip
# without the local artifacts (the conversion is a P0 offline step; the
# release scope is download-on-demand, later).
[[test]]
name = "laya_ane_parity"
required-features = ["laya-riir-ane"]

# The HTTP-edge CORS seam (Phase 2 T1.2): both directions of the
# allow-list, preflight + ACAO echo, and the closed-by-default posture.
[[test]]
name = "serve_cors"
required-features = ["modelless"]

# The Plan 603 T1.5 known-answer units — imports the gated runner slice,
# so it carries the repo-birth pair (file-level #![cfg] in the file + this
# row) that lets a --no-default-features run skip loud instead of dying at
# import resolution.
[[test]]
name = "harness_units"
required-features = ["modelless"]

# Issue 004 (Research 579) T6: the six harness decision-point families —
# count floors, slice disjointness, gold/option agreement, determinism,
# G2 latency, and the cache_reuse loud-skip contract.
[[test]]
name = "harness_families_gates"
required-features = ["modelless"]

# Issue 024 G1/G2: the Rust leak index reproduces the probe's per-suite
# counts EXACTLY over `.raw/datasets` (loud UNSEEN skip when absent), and
# the per-row classify loop allocates nothing once warm.
[[test]]
name = "slice_leak_oracle"
required-features = ["slice_leak"]

# Issue 027 amendment 1 — the CLM determinism pin: N-repeat BYTE-identity
# of the served response over a fixed mixed-kind request + the head
# file's mtime unchanged across the run. Loud UNSEEN skip when
# CLM_SERVE_URL is unset (never a blind pass) — the pin belongs to the
# 4090 window where their stack serves.
[[test]]
name = "clm_determinism_pin"
required-features = ["clm-lane"]

[[bench]]
name = "decision_set_goat"
path = "benches/decision_set_goat.rs"
harness = false
required-features = ["modelless"]

# Issue 004 T6: G2 (p99 per family decision set ≤ 1 ms, tail support
# printed) + G4 (alloc-free core, canary-first) over the family engines —
# the decision_set_goat law applied to the six-point families.
[[bench]]
name = "harness_families_goat"
path = "benches/harness_families_goat.rs"
harness = false
required-features = ["modelless"]

# Issue 013 lever 2: the route_scale sweep probe over the synthetic
# families (measurement only — never a gate).
[[example]]
name = "route_scale_probe"
required-features = ["modelless"]

# The cua-s1-forms arena arm (`.issues/035`, measurement only — never a
# gate, never in the default run): THEIR CoreML model on ANE (coremltools
# subprocess, `scripts/cua_s1_lane.py`) beside our modelless + laya lanes on
# THEIR published test split. The file opens with
# `#![cfg(feature = "modelless")]` (the laya_fixture_timing law — without
# this row a --no-default-features clippy dies E0601). The coreml arm is an
# ITEM-level `target_os = "macos"` cfg with a loud SKIP elsewhere, and the
# laya arm an item-level `laya-riir` cfg with a loud SKIP — required-features
# cannot express either OR, so neither is a whole-file gate.
[[example]]
name = "cua_s1_forms_arena"
required-features = ["modelless"]

# The sgemm shape-timing probe (measurement only — never a gate): the
# kernel-rung A/B instrument over the forward's real matmul_w geometries.
# NO required-features row: the posture arms are item-level cfgs (metal on
# macOS, cuda off it) with a LOUD no-lane fallback main — a whole-file cfg
# row would green-zero the other posture's lane, and `required-features`
# cannot express the OR (the T1.1e rule governs whole-FILE gates; this
# file always compiles a runnable main).
[[example]]
name = "sgemm_shape_timing"

# The laya fixture-timing probe (measurement only — never a gate). The file
# opens with `#![cfg(feature = "laya-riir")]`, so without this row a
# default-features `clippy --all-targets` compiles it to an empty crate and
# dies on E0601 (no `main`).
[[example]]
name = "laya_fixture_timing"
required-features = ["laya-riir"]

# The packed-case stage-split probe (measurement only — never a gate; issue
# 020's typed-trio lever pricing). The file opens with
# `#![cfg(all(target_os = "macos", feature = "laya-riir-metal"))]`, so
# without this row a default-features `clippy --all-targets` compiles it to
# an empty crate and dies on E0601 (the laya_fixture_timing law).
[[example]]
name = "typed_case_split"
required-features = ["laya-riir-metal"]

# The laya parity test is GEMM-bound inside the substrate lane's `gemm`
# calls; the local code is only orchestration. Optimizing DEPENDENCIES in
# the dev profile keeps a plain `cargo test --features laya-riir` within
# minutes instead of ~an hour of opt-0 matmuls, without touching local-code
# debuggability.
[profile.dev.package."*"]
opt-level = 2

# The shipped-binary profile (the cargo-heal lesson): NOT [profile.release]
# on purpose — `cargo bench` inherits release, and the G2 latency gate must
# measure a speed-optimized build, not an opt-for-size one. Strip + fat LTO
# + one codegen unit is the release-artifact posture; the leak scan and the
# remap-path-prefix RUSTFLAGS live in scripts/build-release.sh.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The laya-riir-cubecl lane's gpu tree (riir-infer-gpu, via the path-dep
# chain) compiles against the PARENT workspace's vendored copies — its
# cubecl_runtime.rs video-memory probe needs exactly these. [patch] does
# not cross workspace boundaries, so the rows are re-declared here at the
# parent's vendor/ tree (plan 611 S4; the metal/cuda lanes never pulled
# the gpu tree, which is why reflex never needed these before).
[patch.crates-io]
cubecl-runtime = { path = "../riir-infer/vendor/cubecl-runtime-0.11.0-pre.2" }
wgpu-hal = { path = "../riir-infer/vendor/wgpu-hal-30.0.0" }
