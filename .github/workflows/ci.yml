name: ci

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: check / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout the public sibling (path dep)
        uses: actions/checkout@v4
        with:
          repository: katopz/katgpt-rs
          ref: develop
          path: katgpt-rs
      - name: place the sibling at the layout path
        run: |
          mkdir -p "${{ github.workspace }}/../katgpt-rs"
          cp -R "${{ github.workspace }}/katgpt-rs/." \
                "${{ github.workspace }}/../katgpt-rs/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (the shipped release set)
        # modelless + laya-riir = the release feature set. NOT
        # --all-features: the laya-riir-metal arm is macOS-only by
        # construction (Apple frameworks) and never ships on linux.
        run: cargo check --features laya-riir
      - name: cargo clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (modelless gates, release)
        # --release is the repo's own gate law: the latency gates (G2
        # harness_tool_fit) measure an unoptimised binary in a debug build.
        # The laya parity gate needs the downloaded weights at runtime and
        # stays a workstation lane (`--features laya-riir`).
        run: cargo test --release
