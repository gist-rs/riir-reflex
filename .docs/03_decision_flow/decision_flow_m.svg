<svg xmlns="http://www.w3.org/2000/svg" id="decision-flow-m" data-gfflow="1" viewBox="0 0 340 1064" width="340" height="1064" role="img" aria-labelledby="decision-flow-m-t decision-flow-m-d">
<title id="decision-flow-m-t">Reflex: the decision flow — state in, calibrated answer or honest abstain out</title>
<desc id="decision-flow-m-d">7 steps in path order. 1. Your question: a state plus typed questions — choice, score or yes-no (your machine; live). 2. Embed + route: hashed features; the domain argmax picks your corpus (the modelless engine; live). 3. Score every option: corpus-is-the-model — drafter + centroid cosine (the modelless engine; live). 4. Calibrate: a sigmoid gate turns the signal into confidence (the modelless engine; live). 5a. If signal: Answer: one pick per question + calibrated confidence (answered; live). 5b. If no signal → off-corpus: Abstain: decline, don&#x27;t guess — the full distribution still rides (abstained; live). 6. Refit the gate: offline, one-off, from your labeled data (your machine; live). From 6 back to 4: your data only.</desc>
<style>#decision-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#decision-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#decision-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#decision-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#decision-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#decision-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#decision-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="decision-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1064" rx="14" fill="#11141b"/>
<g data-step="ask" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Your question</text><text x="22" y="80" class="d">a state plus typed questions — choice, score or</text><text x="22" y="98" class="d">yes-no</text></g>
<g data-edge="ask->emb"><path class="e" d="M44,112 V152" stroke="#69718a" marker-end="url(#decision-flow-m-a0)"/>
</g>
<g data-step="emb" data-n="2"><rect class="gf-cb" x="4" y="152" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="164" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="174" class="k" fill="#ff8a3d">THE MODELLESS ENGINE</text><circle cx="280.2" cy="170" r="3.5" fill="#4ade80"/><text x="318" y="174" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="195" r="11" fill="#ff8a3d"/><text x="33" y="199.5" text-anchor="middle" class="n">2</text><text x="54" y="200" class="t">Embed + route</text><text x="22" y="224" class="d">hashed features; the domain argmax picks your</text><text x="22" y="242" class="d">corpus</text></g>
<g data-edge="emb->score"><path class="e" d="M44,256 V296" stroke="#69718a" marker-end="url(#decision-flow-m-a0)"/>
</g>
<g data-step="score" data-n="3"><rect class="gf-cb" x="4" y="296" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="308" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="318" class="k" fill="#ff8a3d">THE MODELLESS ENGINE</text><circle cx="280.2" cy="314" r="3.5" fill="#4ade80"/><text x="318" y="318" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="339" r="11" fill="#ff8a3d"/><text x="33" y="343.5" text-anchor="middle" class="n">3</text><text x="54" y="344" class="t">Score every option</text><text x="22" y="368" class="d">corpus-is-the-model — drafter + centroid</text><text x="22" y="386" class="d">cosine</text></g>
<g data-edge="score->cal"><path class="e" d="M44,400 V440" stroke="#69718a" marker-end="url(#decision-flow-m-a0)"/>
</g>
<g data-step="cal" data-n="4"><rect class="gf-cb" x="4" y="440" width="332" height="144" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="452" width="4" height="120" rx="2" fill="#ff8a3d"/><text x="22" y="462" class="k" fill="#ff8a3d">THE MODELLESS ENGINE</text><circle cx="280.2" cy="458" r="3.5" fill="#4ade80"/><text x="318" y="462" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="483" r="11" fill="#ff8a3d"/><text x="33" y="487.5" text-anchor="middle" class="n">4</text><text x="54" y="488" class="t">Calibrate</text><text x="22" y="512" class="d">a sigmoid gate turns the signal into confidence</text><rect x="22" y="524" width="119.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="538" class="el">→ 5a · signal</text><rect x="22" y="550" width="239.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="564" class="el">→ 5b · no signal → off-corpus</text></g>
<g data-edge="cal->yes"><path class="e" d="M44,584 V624" stroke="#69718a" marker-end="url(#decision-flow-m-a0)"/>
<text class="el" x="56" y="608">signal</text>
</g>
<g data-step="yes" data-n="5a"><rect class="gf-cb" x="4" y="624" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="636" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="646" class="k" fill="#ff8a3d">ANSWERED</text><circle cx="280.2" cy="642" r="3.5" fill="#4ade80"/><text x="318" y="646" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="656" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="671.5" text-anchor="middle" class="n">5a</text><text x="61.6" y="672" class="t">Answer</text><text x="22" y="696" class="d">one pick per question + calibrated confidence</text></g>
<g data-edge="cal->no"><path class="e" d="M44,716 V744" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="734">↳ from 4 · no signal → off-corpus</text></g>
<g data-step="no" data-n="5b"><rect class="gf-cb" x="4" y="750" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="762" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="772" class="k" fill="#ff8a3d">ABSTAINED</text><circle cx="280.2" cy="768" r="3.5" fill="#4ade80"/><text x="318" y="772" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="782" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="797.5" text-anchor="middle" class="n">5b</text><text x="62.4" y="798" class="t">Abstain</text><text x="22" y="822" class="d">decline, don&#x27;t guess — the full distribution still</text><text x="22" y="840" class="d">rides</text></g>
<g data-step="fit" data-n="6"><rect class="gf-cb" x="4" y="894" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="906" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="916" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="912" r="3.5" fill="#4ade80"/><text x="318" y="916" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="937" r="11" fill="#ff8a3d"/><text x="33" y="941.5" text-anchor="middle" class="n">6</text><text x="54" y="942" class="t">Refit the gate</text><text x="22" y="966" class="d">offline, one-off, from your labeled data</text></g>
<g data-edge="fit->cal"><rect x="4" y="998" width="332" height="58" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1024" class="el" style="fill:#ff8a3d">↺ from 6 back to step 4 · your data</text><text x="22" y="1042" class="el" style="fill:#ff8a3d">only</text></g>
</svg>
