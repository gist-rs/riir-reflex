<svg xmlns="http://www.w3.org/2000/svg" id="decision-flow" data-gfflow="1" viewBox="0 0 1756 724" width="1756" height="724" role="img" aria-labelledby="decision-flow-t decision-flow-d">
<title id="decision-flow-t">Reflex: the decision flow — state in, calibrated answer or honest abstain out</title>
<desc id="decision-flow-d">7 steps in path order. 1. Your question: a state plus typed questions — choice, score or yes-no (your machine; live). 2. Embed + route: hashed features; the domain argmax picks your corpus (the modelless engine; live). 3. Score every option: corpus-is-the-model — drafter + centroid cosine (the modelless engine; live). 4. Calibrate: a sigmoid gate turns the signal into confidence (the modelless engine; live). 5a. If signal: Answer: one pick per question + calibrated confidence (answered; live). 5b. If no signal → off-corpus: Abstain: decline, don&#x27;t guess — the full distribution still rides (abstained; live). 6. Refit the gate: offline, one-off, from your labeled data (your machine; live). From 6 back to 4: your data only.</desc>
<style>#decision-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#decision-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#decision-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#decision-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#decision-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#decision-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#decision-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#decision-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#decision-flow .e{fill:none;stroke-width:1.6}#decision-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="decision-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="decision-flow-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a3d"/></marker></defs>
<rect width="1756" height="724" rx="14" fill="#11141b"/>
<g data-lane="you"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">YOUR MACHINE</tspan><tspan class="ln" dx="12">private · free · loopback only</tspan></text></g>
<g data-lane="eng"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">THE MODELLESS ENGINE</tspan><tspan class="ln" dx="12">corpus-is-the-model · no training run</tspan></text></g>
<g data-lane="ans"><rect x="10" y="368" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">ANSWERED</tspan><tspan class="ln" dx="12">calibrated · microseconds</tspan></text></g>
<g data-lane="abst"><rect x="10" y="546" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="571"><tspan class="lh" fill="#ff8a3d">ABSTAINED</tspan><tspan class="ln" dx="12">a designed output, never an error</tspan></text></g>
<g data-edge="ask->emb"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#decision-flow-a0)"/></g>
<g data-edge="emb->score"><path class="e" d="M554,286 618,286" stroke="#69718a" marker-end="url(#decision-flow-a0)"/></g>
<g data-edge="score->cal"><path class="e" d="M848,286 912,286" stroke="#69718a" marker-end="url(#decision-flow-a0)"/></g>
<g data-edge="cal->yes"><path class="e" d="M1142,286 1321,286 1321,410" stroke="#69718a" marker-end="url(#decision-flow-a0)"/><text class="el" x="1231.5" y="277" text-anchor="middle">signal</text></g>
<g data-edge="cal->no"><path class="e" d="M1027,340 1027,642 1206,642" stroke="#69718a" marker-end="url(#decision-flow-a0)"/><text class="el" x="1017" y="495" text-anchor="end">no signal → off-corpus</text></g>
<g data-edge="fit->cal"><path class="eb" d="M1500,108 1027,108 1027,232" stroke="#ff8a3d" marker-end="url(#decision-flow-a1)"/><text class="el" x="1263.5" y="99" text-anchor="middle" style="fill:#ff8a3d">your data only</text></g>
<g data-step="ask" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Your question</text><text x="46" y="109" class="d">a state plus typed questions</text><text x="46" y="128" class="d">— choice, score or yes-no</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="emb" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#ff8a3d"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">Embed + route</text><text x="340" y="287" class="d">hashed features; the domain</text><text x="340" y="306" class="d">argmax picks your corpus</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="score" data-n="3"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#ff8a3d"/><text x="640" y="260.5" text-anchor="middle" class="n">3</text><text x="662" y="261" class="t">Score every option</text><text x="634" y="287" class="d">corpus-is-the-model — drafter</text><text x="634" y="306" class="d">+ centroid cosine</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="cal" data-n="4"><rect class="gf-cb" x="912" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="934" cy="256" r="12" fill="#ff8a3d"/><text x="934" y="260.5" text-anchor="middle" class="n">4</text><text x="956" y="261" class="t">Calibrate</text><text x="928" y="287" class="d">a sigmoid gate turns the signal</text><text x="928" y="306" class="d">into confidence</text><circle cx="932" cy="324" r="4" fill="#4ade80"/><text x="942" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="yes" data-n="5a"><rect class="gf-cb" x="1206" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="1216" y="422" width="29.6" height="24" rx="12" fill="#ff8a3d"/><text x="1230.8" y="438.5" text-anchor="middle" class="n">5a</text><text x="1255.6" y="439" class="t">Answer</text><text x="1222" y="465" class="d">one pick per question +</text><text x="1222" y="484" class="d">calibrated confidence</text><circle cx="1226" cy="502" r="4" fill="#4ade80"/><text x="1236" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="no" data-n="5b"><rect class="gf-cb" x="1206" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="1216" y="600" width="30.4" height="24" rx="12" fill="#ff8a3d"/><text x="1231.2" y="616.5" text-anchor="middle" class="n">5b</text><text x="1256.4" y="617" class="t">Abstain</text><text x="1222" y="643" class="d">decline, don&#x27;t guess — the full</text><text x="1222" y="662" class="d">distribution still rides</text><circle cx="1226" cy="680" r="4" fill="#4ade80"/><text x="1236" y="684" class="s" fill="#4ade80">live</text></g>
<g data-step="fit" data-n="6"><rect class="gf-cb" x="1500" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1522" cy="78" r="12" fill="#ff8a3d"/><text x="1522" y="82.5" text-anchor="middle" class="n">6</text><text x="1544" y="83" class="t">Refit the gate</text><text x="1516" y="109" class="d">offline, one-off, from your</text><text x="1516" y="128" class="d">labeled data</text><circle cx="1520" cy="146" r="4" fill="#4ade80"/><text x="1530" y="150" class="s" fill="#4ade80">live</text></g>
</svg>
