<svg xmlns="http://www.w3.org/2000/svg" id="reflex-dev-flow-m" data-gfflow="1" viewBox="0 0 340 768" width="340" height="768" role="img" aria-labelledby="reflex-dev-flow-m-t reflex-dev-flow-m-d">
<title id="reflex-dev-flow-m-t">Reflex: author a lane — grammar, labels, refit, serve, ship</title>
<desc id="reflex-dev-flow-m-d">6 steps in path order. 1. Author the grammar: state and options as closed-grammar sentences (you, offline; live). 2. Label a slice: a small calibration set — yours, offline (you, offline; live). 3. Refit the gates: thresholds from your labels, one-off (you, offline; live). 4. Serve on loopback: one binary, one allowed origin (your machine; live). 5. Decide: an answer with confidence — or an honest abstain (your machine; live). 6. Ship the binary: corpus and thresholds ride inside (the release; live).</desc>
<style>#reflex-dev-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#reflex-dev-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#reflex-dev-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflex-dev-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#reflex-dev-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#reflex-dev-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#reflex-dev-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="reflex-dev-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="768" rx="14" fill="#11141b"/>
<g data-step="author" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">YOU, OFFLINE · DOCS</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Author the grammar</text><text x="22" y="80" class="d">state and options as closed-grammar</text><text x="22" y="98" class="d">sentences</text></g>
<g data-edge="author->label"><path class="e" d="M44,112 V152" stroke="#69718a" marker-end="url(#reflex-dev-flow-m-a0)"/>
</g>
<g data-step="label" data-n="2"><rect class="gf-cb" x="4" y="152" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="164" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="174" class="k" fill="#ff8a3d">YOU, OFFLINE · DOCS</text><circle cx="280.2" cy="170" r="3.5" fill="#4ade80"/><text x="318" y="174" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="195" r="11" fill="#ff8a3d"/><text x="33" y="199.5" text-anchor="middle" class="n">2</text><text x="54" y="200" class="t">Label a slice</text><text x="22" y="224" class="d">a small calibration set — yours, offline</text></g>
<g data-edge="label->refit"><path class="e" d="M44,238 V278" stroke="#69718a" marker-end="url(#reflex-dev-flow-m-a0)"/>
</g>
<g data-step="refit" data-n="3"><rect class="gf-cb" x="4" y="278" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="290" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="300" class="k" fill="#ff8a3d">YOU, OFFLINE · DOCS</text><circle cx="280.2" cy="296" r="3.5" fill="#4ade80"/><text x="318" y="300" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="321" r="11" fill="#ff8a3d"/><text x="33" y="325.5" text-anchor="middle" class="n">3</text><text x="54" y="326" class="t">Refit the gates</text><text x="22" y="350" class="d">thresholds from your labels, one-off</text></g>
<g data-edge="refit->serve"><path class="e" d="M44,364 V404" stroke="#69718a" marker-end="url(#reflex-dev-flow-m-a0)"/>
</g>
<g data-step="serve" data-n="4"><rect class="gf-cb" x="4" y="404" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="416" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="426" class="k" fill="#ff8a3d">YOUR MACHINE · LOOPBACK</text><circle cx="280.2" cy="422" r="3.5" fill="#4ade80"/><text x="318" y="426" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="447" r="11" fill="#ff8a3d"/><text x="33" y="451.5" text-anchor="middle" class="n">4</text><text x="54" y="452" class="t">Serve on loopback</text><text x="22" y="476" class="d">one binary, one allowed origin</text></g>
<g data-edge="serve->decide"><path class="e" d="M44,490 V530" stroke="#69718a" marker-end="url(#reflex-dev-flow-m-a0)"/>
</g>
<g data-step="decide" data-n="5"><rect class="gf-cb" x="4" y="530" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="542" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="552" class="k" fill="#ff8a3d">YOUR MACHINE · LOOPBACK</text><circle cx="280.2" cy="548" r="3.5" fill="#4ade80"/><text x="318" y="552" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="573" r="11" fill="#ff8a3d"/><text x="33" y="577.5" text-anchor="middle" class="n">5</text><text x="54" y="578" class="t">Decide</text><text x="22" y="602" class="d">an answer with confidence — or an honest</text><text x="22" y="620" class="d">abstain</text></g>
<g data-edge="decide->bin"><path class="e" d="M44,634 V674" stroke="#69718a" marker-end="url(#reflex-dev-flow-m-a0)"/>
</g>
<g data-step="bin" data-n="6"><rect class="gf-cb" x="4" y="674" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="686" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="696" class="k" fill="#ff8a3d">THE RELEASE · ONE STATIC BINARY</text><circle cx="280.2" cy="692" r="3.5" fill="#4ade80"/><text x="318" y="696" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="717" r="11" fill="#ff8a3d"/><text x="33" y="721.5" text-anchor="middle" class="n">6</text><text x="54" y="722" class="t">Ship the binary</text><text x="22" y="746" class="d">corpus and thresholds ride inside</text></g>
</svg>
