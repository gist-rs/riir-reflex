<svg xmlns="http://www.w3.org/2000/svg" id="reflex-dev-flow" data-gfflow="1" viewBox="0 0 1756 546" width="1756" height="546" role="img" aria-labelledby="reflex-dev-flow-t reflex-dev-flow-d">
<title id="reflex-dev-flow-t">Reflex: author a lane — grammar, labels, refit, serve, ship</title>
<desc id="reflex-dev-flow-d">6 steps in path order. 1. Author the grammar: state and options as closed-grammar sentences (you, offline; live). 2. Label a slice: a small calibration set — yours, offline (you, offline; live). 3. Refit the gates: thresholds from your labels, one-off (you, offline; live). 4. Serve on loopback: one binary, one allowed origin (your machine; live). 5. Decide: an answer with confidence — or an honest abstain (your machine; live). 6. Ship the binary: corpus and thresholds ride inside (the release; live).</desc>
<style>#reflex-dev-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#reflex-dev-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#reflex-dev-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflex-dev-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#reflex-dev-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflex-dev-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#reflex-dev-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#reflex-dev-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#reflex-dev-flow .e{fill:none;stroke-width:1.6}#reflex-dev-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="reflex-dev-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1756" height="546" rx="14" fill="#11141b"/>
<g data-lane="desk"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">YOU, OFFLINE</tspan><tspan class="ln" dx="12">docs · labels · the fit</tspan></text></g>
<g data-lane="run"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">YOUR MACHINE</tspan><tspan class="ln" dx="12">loopback · one origin</tspan></text></g>
<g data-lane="ship"><rect x="10" y="368" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">THE RELEASE</tspan><tspan class="ln" dx="12">one static binary</tspan></text></g>
<g data-edge="author->label"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#reflex-dev-flow-a0)"/></g>
<g data-edge="label->refit"><path class="e" d="M554,108 618,108" stroke="#69718a" marker-end="url(#reflex-dev-flow-a0)"/></g>
<g data-edge="refit->serve"><path class="e" d="M848,108 1027,108 1027,232" stroke="#69718a" marker-end="url(#reflex-dev-flow-a0)"/></g>
<g data-edge="serve->decide"><path class="e" d="M1142,286 1206,286" stroke="#69718a" marker-end="url(#reflex-dev-flow-a0)"/></g>
<g data-edge="decide->bin"><path class="e" d="M1436,286 1615,286 1615,410" stroke="#69718a" marker-end="url(#reflex-dev-flow-a0)"/></g>
<g data-step="author" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Author the grammar</text><text x="46" y="109" class="d">state and options as</text><text x="46" y="128" class="d">closed-grammar sentences</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="label" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#ff8a3d"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">Label a slice</text><text x="340" y="109" class="d">a small calibration set —</text><text x="340" y="128" class="d">yours, offline</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="refit" data-n="3"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="78" r="12" fill="#ff8a3d"/><text x="640" y="82.5" text-anchor="middle" class="n">3</text><text x="662" y="83" class="t">Refit the gates</text><text x="634" y="109" class="d">thresholds from your labels,</text><text x="634" y="128" class="d">one-off</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="serve" data-n="4"><rect class="gf-cb" x="912" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="934" cy="256" r="12" fill="#ff8a3d"/><text x="934" y="260.5" text-anchor="middle" class="n">4</text><text x="956" y="261" class="t">Serve on loopback</text><text x="928" y="287" class="d">one binary, one allowed origin</text><circle cx="932" cy="324" r="4" fill="#4ade80"/><text x="942" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="decide" data-n="5"><rect class="gf-cb" x="1206" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1228" cy="256" r="12" fill="#ff8a3d"/><text x="1228" y="260.5" text-anchor="middle" class="n">5</text><text x="1250" y="261" class="t">Decide</text><text x="1222" y="287" class="d">an answer with confidence —</text><text x="1222" y="306" class="d">or an honest abstain</text><circle cx="1226" cy="324" r="4" fill="#4ade80"/><text x="1236" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="bin" data-n="6"><rect class="gf-cb" x="1500" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1522" cy="434" r="12" fill="#ff8a3d"/><text x="1522" y="438.5" text-anchor="middle" class="n">6</text><text x="1544" y="439" class="t">Ship the binary</text><text x="1516" y="465" class="d">corpus and thresholds ride</text><text x="1516" y="484" class="d">inside</text><circle cx="1520" cy="502" r="4" fill="#4ade80"/><text x="1530" y="506" class="s" fill="#4ade80">live</text></g>
</svg>
