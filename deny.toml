# cargo-deny configuration — the supply-chain advisories gate.
# Landed via the plan 298 T2.4 fan-out (the riir-refine pilot: Batch 294 /
# Research 332). Division of labor: cargo-deny owns vulnerable CRATES
# (lockfile surface); the sec corpus owns vulnerable USAGE (code-span classes).
#
# Scope decision (the pilot's): ADVISORIES ONLY are gated
# (`cargo deny check advisories`). licenses/bans/sources keep tool defaults
# until a later plan adjudicates them per repo.
#
# The ignore list is a MEMBERSHIP PIN: every row carries a reason + a tracking
# reference. A bare ignore entry with no reason is a defect in this file.

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0089 — atomic-polyfill is UNMAINTAINED (archived repo), not
    # vulnerable. Target-specific transitive via katgpt-core → postcard 1.x →
    # heapless 0.7 (heapless pulls it only on targets without atomic-pointer
    # support; the lock carries it on every host). Fix is upstream (heapless
    # 0.8 / postcard bump, the katgpt-rs lane — plan 298 T2.3). Measured
    # 2026-10-26, cargo-deny 0.20.2: v2's `unmaintained`/`yanked` keys are
    # SCOPE selectors, not severities, so unmaintained rows fail the gate and
    # are adjudicated per-row through this ledger.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, not vulnerable; target-specific transitive via katgpt-core→postcard→heapless 0.7; fix is upstream (heapless/postcard bump, katgpt-rs lane, plan 298 T2.3)" },
]
